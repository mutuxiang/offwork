<div class="layout"><aside class="intro"><div class="brand"><img src="assets/vectors/00191aa07984fc4b35f9.svg" alt="OffWork" class="brand-logo"></div><div class="tag">MAKE ROOM FOR YOURSELF</div><div class="app-description"><p>下班回到家，脑子里还在<strong>为没做完的工作烦躁</strong>；明明累得不行，却又<strong>舍不得睡觉</strong>，只能在深夜里靠刷手机、打游戏来逃避，结果第二天醒来身体彻底被掏空……</p><p>如果你也陷入过这种<strong>‘越烦越熬、越熬越累’</strong>的死循环，这个 App 就是为你准备的。它帮你在工作与生活之间划清界限，带你<strong>摆脱算法与惯性的围剿</strong>，找回真正能恢复能量的深度休息。</p></div>
